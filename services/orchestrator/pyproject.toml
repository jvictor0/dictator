[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dictator-orchestrator"
version = "0.1.0"
description = "FastAPI orchestration scaffold for Dictator"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "openai-whisper>=20231117",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyyaml>=6.0",
]

[tool.setuptools]
packages = ["app"]
